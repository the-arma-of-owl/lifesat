[General]
network = lifesat.simulations.Lifesat
sim-time-limit = 7d
cmdenv-express-mode = true
repeat = 1
seed-set = ${runnumber}

# Orbit
# FUNCUBE-1 (AO-73); rationale in analysis/select_tle.py, confirmed 27 Jul 2026
*.satellite.mobility.tleFile = absFilePath("tle/cubesat.tle")
*.satellite.mobility.satelliteName = "FUNCUBE-1 (AO-73)"
*.satellite.mobility.epoch = "2026-07-28T00:00:00Z"
*.satellite.mobility.coordinateSystemModule = ""
*.satellite.mobility.updateInterval = 1s

# Yer istasyonu geometrisi
*.access.satelliteMobilityModule = "^.satellite.mobility"
*.access.groundStationLatitude = 38.6786deg      # near Firat University, Elazig
*.access.groundStationLongitude = 39.2094deg
*.access.groundStationAltitude = 1050m
*.access.elevationMask = 10deg
*.access.updateInterval = 1s

# Link
*.link.accessModule = "^.access"
*.link.bitrateUp = 9600bps        # [DESIGN ASSUMPTION] -- enters the sensitivity sweep
*.link.bitrateDown = 38400bps     # K-61: the TM downlink is faster than the TC uplink

# Satellite
*.sat.accessModule = "^.access"
*.sat.satelliteMobilityModule = "^.satellite.mobility"
*.sat.telemetryInterval = 10s
# Design assumption: charge/discharge rates. Phase 1 calibration measured an
# illuminated fraction of 68.8% over FUNCUBE-1's 95.4 min period (from SGP4 plus
# the almanac sun direction), giving 3938 s sunlight and 1786 s eclipse per orbit.
# The balance point is charge = discharge * 0.4535. A healthy battery has positive
# margin; 1.38x was chosen so the channel saws every orbit instead of saturating
# at the ceiling and carrying no information.
# Both numbers enter the sensitivity sweep.
*.sat.chargeRate = 0.00005        # [DESIGN ASSUMPTION] V/s, in sunlight
*.sat.dischargeRate = 0.00008     # [DESIGN ASSUMPTION] V/s, in eclipse
*.sat.voltageNoiseSigma = 0.01    # [TASARIM VARSAYIMI] V

# Ground station traffic
*.gs.accessModule = "^.access"
*.gs.commandInterval = 30s
*.gs.twinModule = "^.twin"
*.gs.flowDetectorModule = "^.flow"
*.gs.randomDetectorModule = "^.rnd"

# Defence variants
# Default is D0, no defence. The [Config D*] blocks below enable them.
#
# KATMAN YAPISI (karar, 27 Tem):
#   D0 = none
#   D1 = command authorisation
#   D2 = D1 + flow anomaly
#   D3 = D1 + twin deviation detector, not fused with D2
# D2 and D3 are therefore measured against a shared base (D1) and stay separate,
# so which layer catches which attack stays visible.
*.sat.commandAuthEnabled = false
*.gs.signCommands = false
*.flow.enabled = false
*.rnd.enabled = false
*.twin.enabled = true

# Twin and D3
*.twin.accessModule = "^.access"
*.twin.satelliteMobilityModule = "^.satellite.mobility"
*.twin.updateInterval = 10s
# The twin's model must not share the satellite's parameters, or the deviation is
# only noise and D3 looks artificially perfect.
*.twin.chargeRate = 0.00005
*.twin.dischargeRate = 0.00008
*.twin.rateBias = 0.06            # the twin's rates are off by 6% (the twin does NOT know this)
*.twin.rateUncertainty = 0.10     # the upper bound the twin declares (this it does know)
*.twin.noiseSigma = 0.01          # to be calibrated from B0
*.twin.sigmaFactor = 3.0

# Attacker
*.attacker.scenario = "B0"        # transparent
*.attacker.accessModule = "^.access"
*.attacker.severity = "medium"
# Design assumption: one pass in four is attacked. This and the severity profile
# together place the anomaly density in the realistic range; both were fixed
# before the runs and enter the sensitivity sweep.
*.attacker.attackedPassFraction = 0.25

*.collector.outputDir = "../results"

# D2 threshold calibration
# Thresholds derive from attack-free runs only, to avoid data leakage.
[Config Calib]
description = "D2 threshold calibration -- B0 only, no attack run is examined"
extends = B0
*.flow.enabled = true
*.flow.calibrationMode = true
*.flow.windowSize = 60s
*.collector.runLabel = "Calib"

#
[Config B0]
description = "no attack -- baseline and detector calibration data"
*.attacker.scenario = "B0"
*.collector.runLabel = "B0-D0"

[Config A1]
description = "MITM-TC -- a field of a valid command is modified and forwarded"
*.attacker.scenario = "A1"
*.collector.runLabel = "A1-D0"

[Config A2]
description = "unauthorised command -- a command the ground never produced is injected"
*.attacker.scenario = "A2"
*.collector.runLabel = "A2-D0"

[Config A3]
description = "replay -- a captured command is replayed with an old sequence number"
*.attacker.scenario = "A3"
*.collector.runLabel = "A3-D0"

[Config A4]
description = "MITM-TM -- telemetry is dropped / delayed / altered"
*.attacker.scenario = "A4"
*.collector.runLabel = "A4-D0"

# Defence layers, crossed with scenarios
# The ini does not form the product; the run script (analysis/run_matrix.py) runs
# each cell with -c <scenario> plus defence overrides. The blocks below are the
# readable definition of those overrides.
#

[Config _D1]
description = "command authorisation (HMAC-SHA256 + freshness + integrity)"
*.sat.commandAuthEnabled = true
*.gs.signCommands = true

[Config _D2]
description = "D1 + flow anomaly (mu +- 3 sigma)"
extends = _D1
*.flow.enabled = true
*.flow.thresholdFile = "../results/d2_thresholds.txt"
*.flow.windowSize = 60s

[Config _D3]
description = "D1 + twin deviation detector"
extends = _D1

# Tier 2: A6, A7c, A8 (single illustrative run, no statistics)
# These three are not part of the 20-cell quantitative matrix.
# They are reported as illustrative; the criterion is reconstructibility and
# channel deviation, not detection.

[Config A6]
description = "unauthorised software update -- command auth OFF: the update is applied, does the twin's logical channel deviate?"
*.attacker.scenario = "A6"
*.sat.commandAuthEnabled = false
*.gs.signCommands = false
*.twin.enabled = true
*.collector.runLabel = "A6-D0"

[Config A6-D1]
description = "unauthorised software update -- command auth ON: is the unsigned update rejected at the gate?"
extends = _D1
*.attacker.scenario = "A6"
*.twin.enabled = true
*.collector.runLabel = "A6-D1"

[Config A2v]
description = "command re-signed with a stolen key -- the crypto is VALID and D1 lets it through; if it is to be caught, the twin's logical channel must catch it"
extends = _D3
*.attacker.scenario = "A2v"
*.attacker.compromisedKey = "LIFESAT-TC-KEY"
*.collector.runLabel = "A2v-D3"

[Config A2v-D1]
description = "same scenario, twin OFF -- what does D1 alone do against a validly signed malicious command (expected: nothing)"
extends = _D1
*.attacker.scenario = "A2v"
*.attacker.compromisedKey = "LIFESAT-TC-KEY"
*.twin.enabled = false
*.collector.runLabel = "A2v-D1"

# A6s -- a validly signed but behaviourally unsafe update
# Abstract'in in-orbit fazi: "updates are first tested within the DT.  Upon
# successful validation, verified updates are transmitted."  Tehdit yol-ustu
# NOT that: the candidate update arrives through the operator's own approval chain
# (a faulty build or a supply-chain artefact), is validly signed, and D1 passes it by
# definition.
# Two arms: validation gate ON (prevention) and OFF (control arm).

[Config A6s]
description = "unsafe update + pre-uplink twin validation ON -- it must never be sent to the satellite"
extends = _D1
*.attacker.scenario = "B0"
*.twin.enabled = true
*.gs.proposeUpdates = true
*.gs.twinValidation = true
*.gs.updateInterval = 12h
*.gs.updateValue = 0.0004      # 5x nominal desarj -- enerji dengesi negatif
*.collector.runLabel = "A6s-gate-on"

[Config A6s-nogate]
description = "the same update, validation gate OFF -- it is applied and D3 sees the deviation afterwards"
extends = _D1
*.attacker.scenario = "B0"
*.twin.enabled = true
*.gs.proposeUpdates = true
*.gs.twinValidation = false
*.gs.updateInterval = 12h
*.gs.updateValue = 0.0004
*.collector.runLabel = "A6s-gate-off"

[Config A6s-safe]
description = "negative control: a SAFE update must pass the gate (the gate does not reject everything)"
extends = _D1
*.attacker.scenario = "B0"
*.twin.enabled = true
*.gs.proposeUpdates = true
*.gs.twinValidation = true
*.gs.updateInterval = 12h
*.gs.updateValue = 0.00009     # close to nominal -- must stay inside the envelope
*.collector.runLabel = "A6s-safe"

[Config A7c]
description = "forensic record tampering -- D1 rejects the command, the attacker freezes rejectedCmdCount on the downlink"
extends = _D3
*.attacker.scenario = "A7c"
*.collector.runLabel = "A7c-D3"

[Config A8]
description = "resynchronisation window hijack -- fake telemetry at the start of a pass (when dt is widest)"
extends = _D3
*.attacker.scenario = "A8"
*.attacker.episodeStartFraction = 0.0
*.attacker.episodeSpanFraction = 0.05
*.collector.runLabel = "A8-D3"

# A6s additional arms
[Config A6s-unsupported]
description = "a parameter the twin cannot model -- UNSUPPORTED, fail-closed, must NOT be uplinked"
extends = _D1
*.attacker.scenario = "B0"
*.twin.enabled = true
*.gs.proposeUpdates = true
*.gs.twinValidation = true
*.gs.updateInterval = 12h
*.gs.updateKey = "thermalSetpoint"     # a parameter the envelope does not cover
*.gs.updateValue = 42.0
*.collector.runLabel = "A6s-unsupported"

[Config A6s-safe-large]
description = "a SAFE but clearly off-nominal discharge rate -- after validation the twin must update its model and must not produce a persistent false alarm"
extends = _D1
*.attacker.scenario = "B0"
*.twin.enabled = true
*.gs.proposeUpdates = true
*.gs.twinValidation = true
*.gs.updateInterval = 12h
*.gs.updateValue = 0.000105           # inside the envelope (ceiling ~0.000110) but 31% above nominal
*.collector.runLabel = "A6s-safe-large"
