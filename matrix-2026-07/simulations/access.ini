[General]
network = lifesat.simulations.AccessOnly
sim-time-limit = 24h
cmdenv-express-mode = true
repeat = 1

# --- Orbit -------------------------------------------------------------------
# Mission satellite: FUNCUBE-1 (AO-73), NORAD 39444, an active amateur radio CubeSat
# at 536 km, 97.8 deg sun-synchronous. Its UHF/VHF telemetry is public.
# "CubeSat missions of this class operate predominantly in VHF and UHF bands
# Selection confirmed 27 Jul 2026.
#
# TLE source: Celestrak CubeSat group (85 satellites), downloaded 27 Jul 2026.
# Keep the epoch close to the TLE epoch: SGP4 is valid for days to weeks.
#    Selection rationale and the table of 33 SSO candidates: analysis/select_tle.py
*.satellite.mobility.tleFile = absFilePath("tle/cubesat.tle")
*.satellite.mobility.satelliteName = "FUNCUBE-1 (AO-73)"
*.satellite.mobility.epoch = "2026-07-28T00:00:00Z"
*.satellite.mobility.coordinateSystemModule = ""
*.satellite.mobility.updateInterval = 1s

# --- Yer istasyonu -----------------------------------------------------------
# near Firat University, Elazig
*.access.satelliteMobilityModule = "^.satellite.mobility"
*.access.groundStationLatitude = 38.6786deg
*.access.groundStationLongitude = 39.2094deg
*.access.groundStationAltitude = 1050m
*.access.elevationMask = 10deg
*.access.updateInterval = 1s

*.collector.runLabel = "phase0-access"
*.collector.outputDir = "../results"

# Orbital geometry is the only determinant here; the result is deterministic.
