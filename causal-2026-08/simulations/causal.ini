# LIFESAT phase 3 causal pilot configuration
#
# No pair-specific number appears in this file, and none may.
#
# Onset, magnitude, tolerance, eclipse step, counter delta and robustness-arm
# amplitude are all read from the accepted phase 2 contract and passed on the
# command line by analysis/causal/runcell.py. A copy written here would be a
# second source of truth that could drift from the contract silently, which is
# exactly what this avoids.
#
# The only configuration run is [Config Causal]; the caller also supplies the run
# identity (pairId, arm, robustnessArm, runSeedIndex, runId).

[General]
network = lifesat.simulations.Lifesat
sim-time-limit = 7d
cmdenv-express-mode = true
repeat = 1
seed-set = ${runnumber}

# Orbit
# FUNCUBE-1 (AO-73), unchanged from phase 1; model_authority was read from this code.
# Amendment v5: the pass schedule must be precomputable from the TLE and the
# epoch, so the mobility module exposes SGP4 propagation to an arbitrary time.
# Behaviour is otherwise identical to inet SatelliteMobility.
*.satellite.mobility.tleFile = absFilePath("tle/cubesat.tle")
*.satellite.mobility.satelliteName = "FUNCUBE-1 (AO-73)"
*.satellite.mobility.epoch = "2026-07-28T00:00:00Z"
*.satellite.mobility.coordinateSystemModule = ""
*.satellite.mobility.updateInterval = 1s

# Yer istasyonu geometrisi
*.access.satelliteMobilityModule = "^.satellite.mobility"
*.access.groundStationLatitude = 38.6786deg      # near Firat University, Elazig
*.access.groundStationLongitude = 39.2094deg
*.access.groundStationAltitude = 1050m
*.access.elevationMask = 10deg
*.access.updateInterval = 1s

# Link
*.link.accessModule = "^.access"
*.link.causalModule = "^.causal"
*.link.bitrateUp = 9600bps
*.link.bitrateDown = 38400bps

# Satellite
*.sat.accessModule = "^.access"
*.sat.satelliteMobilityModule = "^.satellite.mobility"
*.sat.causalModule = "^.causal"
*.sat.telemetryInterval = 10s
*.sat.chargeRate = 0.00005        # model_authority.charge_rate_vps
*.sat.dischargeRate = 0.00008     # model_authority.discharge_rate_vps
*.sat.voltageNoiseSigma = 0.01    # model_authority.voltage_noise_sigma_v

# Ground station traffic
*.gs.accessModule = "^.access"
*.gs.commandInterval = 30s
*.gs.twinModule = "^.twin"
*.gs.flowDetectorModule = ""
*.gs.randomDetectorModule = ""

# Twin and D3
*.twin.accessModule = "^.access"
*.twin.satelliteMobilityModule = "^.satellite.mobility"
*.twin.enabled = true
*.twin.updateInterval = 10s
*.twin.chargeRate = 0.00005
*.twin.dischargeRate = 0.00008
# On inferential arms the twin's rates match the satellite exactly (rateBias = 0).
#
# rateBias is the declared perturbation of the RB-model-mismatch arm (twin
# discharge-rate bias, amplitude 0.06). Leaving it on in every run would make the
# robustness arm identical to the baseline and erase what that arm measures.
#
*.twin.rateBias = 0.0
*.twin.rateUncertainty = 0.10     # model_authority.twin_rate_uncertainty
*.twin.noiseSigma = 0.01          # model_authority.twin_noise_sigma_v
*.twin.sigmaFactor = 3.0          # model_authority.twin_sigma_factor

# Attacker
# The old scenario machine is off and never set up in causal mode; the scenario
# field carries a valid value only for the module's own validation.
*.attacker.scenario = "B0"
*.attacker.accessModule = "^.access"
*.attacker.causalModule = "^.causal"

*.flow.enabled = false
*.rnd.enabled = false

*.causal.collectorModule = "^.collector"
*.causal.accessModule = "^.access"

#
[Config Causal]
description = "phase 3 causal pilot -- the study identity and every number pass through the accepted contract on the caller's side"
