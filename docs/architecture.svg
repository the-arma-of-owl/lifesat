<svg xmlns="http://www.w3.org/2000/svg" width="470" height="247.8" viewBox="0 0 470 247.8" role="img">
<title id="fig1-title">LIFESAT data flow and defence layering</title>
<desc id="fig1-desc">Architecture diagram. No effectiveness claim.</desc>
